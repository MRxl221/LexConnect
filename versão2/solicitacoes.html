<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas solicitações — Lex Connect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="nav"></header>

<main class="page">
  <div class="container">
    <h1>Minhas solicitações</h1>
    <p class="sub2" id="who"></p>
    <div id="list"></div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  if (LC.requireAuth()) init();

  function init() {
    LC.renderNav('solicitacoes');
    const s = LC.session();
    document.getElementById('who').textContent = s.nome + ' · ' + s.email;
    draw();
  }

  function draw() {
    const s = LC.session();
    const mine = LC.requests().filter(r => r.userId === s.id);
    const box = document.getElementById('list');

    if (!mine.length) {
      box.innerHTML = `<div class="card empty"><p>Você ainda não enviou nenhuma solicitação.</p>
        <a class="btn btn-gold" href="advogados.html">Buscar advogados próximos</a></div>`;
      return;
    }

    box.innerHTML = mine.map(r => {
      const d = new Date(r.data).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
      const cancelled = r.status === 'Cancelada';
      return `<div class="card req">
        <div class="avatar">${LC.esc(LC.initials(r.advogado.nome))}</div>
        <div class="grow">
          <h3>${LC.esc(r.advogado.nome)}</h3>
          <p>${LC.esc(r.assunto)} · ${d}</p>
          <p style="margin-top:6px;color:var(--txt)">${LC.esc(r.mensagem)}</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
          <span class="status ${cancelled ? 'cancel' : ''}">${LC.esc(r.status)}</span>
          <a class="btn btn-ghost btn-sm" href="advogado.html?id=${encodeURIComponent(r.advogado.id)}">Ver perfil</a>
          ${cancelled ? '' : `<button class="btn btn-ghost btn-sm" data-cancel="${r.id}">Cancelar</button>`}
        </div>
      </div>`;
    }).join('');

    box.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
      if (!confirm('Cancelar esta solicitação?')) return;
      const all = LC.requests();
      const item = all.find(r => r.id === b.dataset.cancel);
      if (item) item.status = 'Cancelada';
      LC.saveRequests(all);
      LC.toast('Solicitação cancelada.');
      draw();
    });
  }
</script>
</body>
</html>
